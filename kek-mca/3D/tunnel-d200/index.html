<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トンネル天井 200 cm 宇宙線 4dtrack 3D — KEK MCA</title>
  <script src="../../../theme-boot.js"></script>
  <link rel="stylesheet" href="../../../theme.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
    }
    header {
      flex: 0 0 auto;
      padding: 0.55rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .header-top {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      align-items: baseline;
    }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 650; }
    header .note { font-size: 0.85rem; color: var(--muted); margin: 0; }
    header a { color: var(--link); }
    .main-area {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: row;
    }
    .plot-wrap { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; }
    #plot { width: 100%; height: 100%; }
    .info-panel {
      flex: 0 0 320px;
      max-width: 38vw;
      overflow-y: auto;
      border-left: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .info-panel section { padding: 0.65rem 0.85rem; border-bottom: 1px solid var(--border); }
    .info-panel h2 {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0 0 0.45rem;
      font-weight: 650;
    }
    .info-panel dl {
      display: grid;
      grid-template-columns: 9.5rem 1fr;
      gap: 0.2rem 0.5rem;
      margin: 0;
    }
    .info-panel dt { color: var(--muted); margin: 0; }
    .info-panel dd { margin: 0; font-variant-numeric: tabular-nums; }
    table.stats {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    table.stats th, table.stats td {
      border: 1px solid var(--border);
      padding: 0.25rem 0.35rem;
      text-align: right;
    }
    table.stats th:first-child, table.stats td:first-child { text-align: left; }
    table.stats th { background: var(--surface-2, var(--surface)); color: var(--muted); font-weight: 600; }
    .legend-note {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 2;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid var(--border);
      padding: 8px 12px;
      font-size: 12px;
      border-radius: 6px;
      pointer-events: none;
      line-height: 1.5;
    }
    .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
    #status { padding: 0.5rem 1rem; font-size: 0.85rem; color: var(--muted); }
    .bar-row {
      display: grid;
      grid-template-columns: 4.5rem 1fr 4.8rem;
      gap: 0.35rem;
      align-items: center;
      margin: 0.3rem 0;
      font-size: 0.78rem;
    }
    .bar-track { height: 0.85rem; background: color-mix(in srgb, var(--border) 70%, transparent); border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; }
    .bar-fill.center { background: #2f6fed; }
    .bar-fill.corner { background: #c45c26; }
    @media (max-width: 960px) {
      .main-area { flex-direction: column; }
      .info-panel { flex: 0 0 auto; max-width: none; border-left: none; border-top: 1px solid var(--border); max-height: 42vh; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <p class="note">
        <a href="../">← He-3 4dtrack</a> ·
        <a href="../tunnel/">トンネル 0–1000 m</a> ·
        <a href="../../../tunnel-ceiling-d200/">スペクトル比較</a> ·
        <a href="../../">KEK MCA</a>
      </p>
      <h1>トンネル天井 200&nbsp;cm — 宇宙線 4dtrack 3D（上空入射）</h1>
      <p class="note" id="metaLine">PHITS · 読込中…</p>
    </div>
  </header>
  <div class="main-area">
    <div class="plot-wrap">
      <div id="plot"></div>
      <div class="legend-note">
        <span class="sw" style="background:#4FC3F7"></span>μ⁺　
        <span class="sw" style="background:#29B6F6"></span>μ⁻　
        <span class="sw" style="background:#66BB6A"></span>中性子　
        <span class="sw" style="background:#EF5350"></span>陽子<br>
        <span class="sw" style="background:#2f6fed"></span>Center　
        <span class="sw" style="background:#c45c26"></span>Corner<br>
        灰点線: コンクリート　緑: トンネル空洞　紫: 線源面（上空）
      </div>
    </div>
    <aside class="info-panel">
      <section>
        <h2>軌跡数（4dtrack 可視化）</h2>
        <div id="currentStats">—</div>
      </section>
      <section>
        <h2>検出器フラックス比較（本番統計）</h2>
        <div id="detCompare">—</div>
      </section>
      <section>
        <h2>二次粒子・トンネル内</h2>
        <dl id="secondaryStats"></dl>
      </section>
      <section>
        <h2>エネルギー [MeV]（ROI内）</h2>
        <div id="energyTable">—</div>
      </section>
      <section>
        <h2>領域別軌跡数（最深点）</h2>
        <div id="regionTable">—</div>
      </section>
      <section>
        <h2>ジオメトリ</h2>
        <dl id="geomStats"></dl>
      </section>
      <section>
        <h2>シミュレーション条件</h2>
        <dl id="simMeta"></dl>
      </section>
    </aside>
  </div>
  <p id="status">読み込み中…</p>
  <script>
    const ORDER = ["muon+", "muon-", "neutron", "proton"];
    const LABELS = { "muon+": "μ⁺", "muon-": "μ⁻", neutron: "中性子", proton: "陽子" };
    let pack = null;

    function fmt(n, d = 2) {
      if (n == null || Number.isNaN(n)) return "—";
      if (Math.abs(n) >= 1000) return n.toExponential(2);
      if (Math.abs(n) >= 100) return n.toFixed(0);
      if (Math.abs(n) >= 10) return n.toFixed(1);
      return n.toFixed(d);
    }
    function sci(x, d = 3) {
      if (x == null || !Number.isFinite(x)) return "—";
      return Number(x).toExponential(d);
    }

    function buildData() {
      const data = [];
      for (const name of ORDER) {
        const p = pack.particles[name];
        if (!p) continue;
        data.push({
          type: "scatter3d", mode: "lines",
          name: (LABELS[name] || name) + " (" + p.n + ")",
          x: p.x, y: p.y, z: p.z, text: p.text,
          hovertemplate: "%{text}<extra></extra>",
          line: { color: p.color, width: p.width }, opacity: p.opacity,
        });
      }
      const g = pack.geom;
      data.push({ type: "scatter3d", mode: "lines", name: "concrete",
        x: g.concrete.x, y: g.concrete.y, z: g.concrete.z,
        line: { color: "#90A4AE", width: 3, dash: "dot" }, hoverinfo: "skip" });
      data.push({ type: "scatter3d", mode: "lines", name: "tunnel air",
        x: g.tunnel.x, y: g.tunnel.y, z: g.tunnel.z,
        line: { color: "#A5D6A7", width: 4 }, hoverinfo: "skip" });
      data.push({ type: "scatter3d", mode: "lines", name: "Center detector",
        x: g.center.x, y: g.center.y, z: g.center.z,
        line: { color: "#2f6fed", width: 6 }, hoverinfo: "skip" });
      data.push({ type: "scatter3d", mode: "lines", name: "Corner detector",
        x: g.corner.x, y: g.corner.y, z: g.corner.z,
        line: { color: "#c45c26", width: 6 }, hoverinfo: "skip" });
      data.push({ type: "scatter3d", mode: "lines", name: "ground z=0",
        x: g.ground.x, y: g.ground.y, z: g.ground.z,
        line: { color: "#BCAAA4", width: 2 }, hoverinfo: "skip" });
      data.push({ type: "scatter3d", mode: "lines", name: "source plane (sky)",
        x: g.source.x, y: g.source.y, z: g.source.z,
        line: { color: "#CE93D8", width: 3 }, hoverinfo: "skip" });
      return data;
    }

    function layout() {
      return {
        title: "c10 = 200 cm（天井 2.0 m）· 上空宇宙線入射",
        scene: {
          xaxis: { title: "x [cm]", range: [-900, 900] },
          yaxis: { title: "y [cm]", range: [-550, 550] },
          zaxis: { title: "z [cm] (上=地表)", range: pack.z_range },
          aspectmode: "manual",
          aspectratio: { x: 1.15, y: 0.7, z: 1.45 },
          camera: { eye: { x: 1.35, y: 1.55, z: 0.85 }, up: { x: 0, y: 0, z: 1 } },
        },
        legend: { title: { text: "click to toggle" } },
        margin: { l: 0, r: 0, t: 40, b: 0 },
        template: "plotly_white",
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        font: { color: "var(--fg)" },
      };
    }

    function renderCurrentStats() {
      const s = pack.stats;
      const roi = s.tracks_in_view_roi;
      const disp = s.tracks_displayed;
      const raw = s.tracks_raw_by_particle;
      let html = "<dl>";
      html += "<dt>履歴数</dt><dd>" + s.histories + " <span style='color:var(--muted)'>（" + s.histories_note + "）</span></dd>";
      html += "<dt>4dtrack 全軌跡</dt><dd>" + s.tracks_raw_all.toLocaleString() + " 本</dd>";
      html += "<dt>表示中（描画）</dt><dd>" + Object.values(disp).reduce((a,b)=>a+b,0).toLocaleString() + " 本</dd>";
      html += "<dt>計算時間</dt><dd>" + (s.run.wall_sec != null ? s.run.wall_sec + " s" : "—") + "</dd>";
      html += "<dt>出力サイズ</dt><dd>" + (s.run.file_bytes != null ? (s.run.file_bytes/1e6).toFixed(1) + " MB" : "—") + "</dd>";
      html += "</dl>";
      html += "<table class='stats' style='margin-top:0.5rem'><thead><tr><th>粒子</th><th>raw</th><th>ROI</th><th>表示</th></tr></thead><tbody>";
      for (const name of ORDER) {
        html += "<tr><td>" + (LABELS[name]||name) + "</td><td>" + (raw[name]||0) + "</td><td>" + (roi[name]||0) + "</td><td>" + (disp[name]||0) + "</td></tr>";
      }
      html += "</tbody></table>";
      html += "<p class='note' style='margin:0.4rem 0 0;font-size:0.75rem;color:var(--muted)'>紫の線源面から下向きに宇宙線が入射します（dir=cr）。</p>";
      document.getElementById("currentStats").innerHTML = html;
    }

    function renderDetectors() {
      const d = pack.detectors;
      if (!d) {
        document.getElementById("detCompare").textContent = "—";
        return;
      }
      const cs = d.center, ks = d.corner;
      const maxS = Math.max(cs.sum, ks.sum);
      const hits = pack.stats.detector_track_hits || { center: {}, corner: {} };
      document.getElementById("detCompare").innerHTML = `
        <p class="note" style="margin:0 0 0.4rem;font-size:0.75rem;color:var(--muted)">本番 1×10⁷ histories の T-Track 積分</p>
        <div class="bar-row"><span>Center</span><div class="bar-track"><div class="bar-fill center" style="width:${100*cs.sum/maxS}%"></div></div><span>${sci(cs.sum)}</span></div>
        <div class="bar-row"><span>Corner</span><div class="bar-track"><div class="bar-fill corner" style="width:${100*ks.sum/maxS}%"></div></div><span>${sci(ks.sum)}</span></div>
        <dl style="margin-top:0.45rem">
          <dt>比 Center/Corner</dt><dd><strong>${d.ratio_center_over_corner.toFixed(3)}</strong></dd>
        </dl>
        <table class="stats" style="margin-top:0.4rem">
          <thead><tr><th>4dtrack通過</th><th>Center</th><th>Corner</th></tr></thead>
          <tbody>
            ${ORDER.map(n => `<tr><td>${LABELS[n]}</td><td>${hits.center[n]||0}</td><td>${hits.corner[n]||0}</td></tr>`).join("")}
          </tbody>
        </table>`;
    }

    function renderSecondary() {
      const sec = pack.stats.secondary;
      document.getElementById("secondaryStats").innerHTML = ""
        + "<dt>中性子 / μ 軌跡</dt><dd>" + fmt(sec.neutron_per_muon_track, 3) + "</dd>"
        + "<dt>陽子 / μ 軌跡</dt><dd>" + fmt(sec.proton_per_muon_track, 3) + "</dd>"
        + "<dt>中性子 / 履歴</dt><dd>" + fmt(sec.neutron_per_history, 3) + "</dd>"
        + "<dt>陽子 / 履歴</dt><dd>" + fmt(sec.proton_per_history, 3) + "</dd>"
        + "<dt>μ（空洞内）</dt><dd>" + sec.muon_tracks_in_tunnel_air + "</dd>"
        + "<dt>中性子（空洞内）</dt><dd>" + sec.neutron_tracks_in_tunnel_air + "</dd>";
    }

    function renderEnergy() {
      const e = pack.stats.energy_mev;
      let html = "<table class='stats'><thead><tr><th>粒子</th><th>n</th><th>min</th><th>median</th><th>max</th><th>mean</th></tr></thead><tbody>";
      for (const name of ORDER) {
        const row = e[name];
        if (!row) continue;
        html += "<tr><td>" + (LABELS[name]||name) + "</td>"
          + "<td>" + row.n + "</td>"
          + "<td>" + fmt(row.min_mev) + "</td>"
          + "<td>" + fmt(row.median_mev) + "</td>"
          + "<td>" + fmt(row.max_mev) + "</td>"
          + "<td>" + fmt(row.mean_mev) + "</td></tr>";
      }
      html += "</tbody></table>";
      document.getElementById("energyTable").innerHTML = html;
    }

    function renderRegion() {
      const reg = pack.stats.by_region;
      const regions = ["tunnel_air", "center_detector", "corner_detector", "concrete", "soil_or_outer", "above_surface"];
      const regLabel = {
        tunnel_air: "トンネル空洞", center_detector: "Center検出器", corner_detector: "Corner検出器",
        concrete: "コンクリート", soil_or_outer: "外側", above_surface: "地表面上",
      };
      let html = "<table class='stats'><thead><tr><th>領域</th>";
      for (const name of ORDER) html += "<th>" + (LABELS[name]||name) + "</th>";
      html += "</tr></thead><tbody>";
      for (const r of regions) {
        if (!reg[r]) continue;
        html += "<tr><td>" + (regLabel[r]||r) + "</td>";
        for (const name of ORDER) html += "<td>" + (reg[r][name]||0) + "</td>";
        html += "</tr>";
      }
      html += "</tbody></table>";
      document.getElementById("regionTable").innerHTML = html;
    }

    function renderGeom() {
      const g = pack.stats.geometry_depth;
      document.getElementById("geomStats").innerHTML = ""
        + "<dt>天井深さ</dt><dd>" + g.c10_cm + " cm（" + g.ceiling_depth_m + " m）</dd>"
        + "<dt>空洞上面 z</dt><dd>" + g.tunnel_top_z_cm + " cm</dd>"
        + "<dt>空洞下面 z</dt><dd>" + g.tunnel_bottom_z_cm + " cm</dd>"
        + "<dt>コンクリート</dt><dd>z=" + g.concrete_bottom_z_cm + " … " + g.concrete_top_z_cm + " cm</dd>";
    }

    function renderSimMeta() {
      const m = pack.meta;
      const src = m.source;
      document.getElementById("simMeta").innerHTML = ""
        + "<dt>PHITS</dt><dd>" + m.phits + "</dd>"
        + "<dt>線源</dt><dd>e-type=" + src.e_type + ", icenv=" + src.icenv + ", dir=" + src.dir + "</dd>"
        + "<dt>位置</dt><dd>" + src.location + "</dd>"
        + "<dt>入射粒子</dt><dd>" + src.particles.join(", ") + "</dd>"
        + "<dt>線源半径</dt><dd>" + src.radius_cm + " cm（z=" + src.z_cm + " cm）</dd>"
        + "<dt>注記</dt><dd>" + (m.flux_stats_note || "") + "</dd>";
    }

    async function init() {
      const statusEl = document.getElementById("status");
      statusEl.hidden = false;
      statusEl.textContent = "軌跡データを読み込み中…";
      const res = await fetch("./tracks.json");
      if (!res.ok) throw new Error("tracks.json: " + res.status);
      pack = await res.json();
      document.getElementById("metaLine").textContent =
        pack.meta.phits + " · " + pack.stats.histories + " histories · " + pack.meta.source.location;
      renderCurrentStats();
      renderDetectors();
      renderSecondary();
      renderEnergy();
      renderRegion();
      renderGeom();
      renderSimMeta();
      statusEl.hidden = true;
      Plotly.newPlot("plot", buildData(), layout(), { responsive: true });
    }

    init().catch((err) => {
      const statusEl = document.getElementById("status");
      statusEl.hidden = false;
      statusEl.textContent = "読み込み失敗: " + err.message;
    });
  </script>
  <script src="../../../theme.js"></script>
</body>
</html>
