<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トンネル宇宙線 4dtrack 3D — KEK MCA</title>
  <script src="../../../theme-boot.js"></script>
  <link rel="stylesheet" href="../../../theme.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
    }
    header {
      flex: 0 0 auto;
      padding: 0.55rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .header-top {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      align-items: baseline;
    }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 650; }
    header .note { font-size: 0.85rem; color: var(--muted); margin: 0; }
    header a { color: var(--link); }
    .header-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 2rem;
      margin-top: 0.5rem;
      align-items: flex-start;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 240px;
      flex: 1;
    }
    .controls label { font-size: 0.85rem; }
    .controls input[type=range] { width: 100%; max-width: 420px; }
    .main-area {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: row;
    }
    .plot-wrap { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; }
    #plot { width: 100%; height: 100%; }
    .info-panel {
      flex: 0 0 320px;
      max-width: 38vw;
      overflow-y: auto;
      border-left: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .info-panel section { padding: 0.65rem 0.85rem; border-bottom: 1px solid var(--border); }
    #secCompare { max-height: 220px; overflow-y: auto; }
    .info-panel h2 {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0 0 0.45rem;
      font-weight: 650;
    }
    .info-panel dl {
      display: grid;
      grid-template-columns: 9.5rem 1fr;
      gap: 0.2rem 0.5rem;
      margin: 0;
    }
    .info-panel dt { color: var(--muted); margin: 0; }
    .info-panel dd { margin: 0; font-variant-numeric: tabular-nums; }
    table.stats {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    table.stats th, table.stats td {
      border: 1px solid var(--border);
      padding: 0.25rem 0.35rem;
      text-align: right;
    }
    table.stats th:first-child, table.stats td:first-child { text-align: left; }
    table.stats th { background: var(--surface-2, var(--surface)); color: var(--muted); font-weight: 600; }
    table.stats tr.active { background: color-mix(in srgb, var(--link) 12%, transparent); }
    .pill-row { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem; }
    .pill {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }
    .legend-note {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 2;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid var(--border);
      padding: 8px 12px;
      font-size: 12px;
      border-radius: 6px;
      pointer-events: none;
      line-height: 1.5;
    }
    .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
    #status { padding: 0.5rem 1rem; font-size: 0.85rem; color: var(--muted); }
    @media (max-width: 960px) {
      .main-area { flex-direction: column; }
      .info-panel { flex: 0 0 auto; max-width: none; border-left: none; border-top: 1px solid var(--border); max-height: 42vh; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <p class="note"><a href="../">← He-3 4dtrack</a> · <a href="../../">KEK MCA</a></p>
      <h1>トンネル / 土中 — 宇宙線 4dtrack 3D（0–1000 m）</h1>
      <p class="note" id="metaLine">PHITS · 読込中…</p>
    </div>
    <div class="header-row">
      <div class="controls">
        <label for="depth">天井深さ c10 = <strong id="depthVal">—</strong> cm（<span id="depthM">—</span> m）</label>
        <input id="depth" type="range" min="0" max="0" step="1" disabled>
      </div>
    </div>
  </header>
  <div class="main-area">
    <div class="plot-wrap">
      <div id="plot"></div>
      <div class="legend-note">
        <span class="sw" style="background:#4FC3F7"></span>μ⁺　
        <span class="sw" style="background:#29B6F6"></span>μ⁻　
        <span class="sw" style="background:#66BB6A"></span>中性子　
        <span class="sw" style="background:#EF5350"></span>陽子<br>
        灰点線: コンクリート　緑: トンネル空洞　紫: 線源面
      </div>
    </div>
    <aside class="info-panel" id="infoPanel">
      <section id="secCurrent">
        <h2>現在の深度 — 軌跡数</h2>
        <div id="currentStats">—</div>
      </section>
      <section id="secSecondary">
        <h2>二次粒子・トンネル内</h2>
        <dl id="secondaryStats"></dl>
      </section>
      <section id="secEnergy">
        <h2>エネルギー [MeV]（ROI内全軌跡）</h2>
        <div id="energyTable">—</div>
      </section>
      <section id="secRegion">
        <h2>領域別軌跡数（最深点で分類）</h2>
        <div id="regionTable">—</div>
      </section>
      <section id="secGeom">
        <h2>ジオメトリ（現在深度）</h2>
        <dl id="geomStats"></dl>
      </section>
      <section id="secSim">
        <h2>シミュレーション条件</h2>
        <dl id="simMeta"></dl>
      </section>
      <section id="secCompare">
        <h2>深度スイープ比較</h2>
        <div id="compareTable">—</div>
      </section>
    </aside>
  </div>
  <p id="status" hidden>読み込み中…</p>
  <script>
    const ORDER = ["muon+", "muon-", "neutron", "proton"];
    const LABELS = { "muon+": "μ⁺", "muon-": "μ⁻", neutron: "中性子", proton: "陽子" };
    const slider = document.getElementById("depth");
    const depthVal = document.getElementById("depthVal");
    const depthM = document.getElementById("depthM");
    let depths = [], byDepth = {}, meta = {}, summaryTable = [];

    function fmt(n, d = 2) {
      if (n == null || Number.isNaN(n)) return "—";
      if (Math.abs(n) >= 1000) return n.toExponential(2);
      if (Math.abs(n) >= 100) return n.toFixed(0);
      if (Math.abs(n) >= 10) return n.toFixed(1);
      return n.toFixed(d);
    }

    function buildData(pack) {
      const data = [];
      for (const name of ORDER) {
        const p = pack.particles[name];
        if (!p) continue;
        data.push({
          type: "scatter3d", mode: "lines",
          name: (LABELS[name] || name) + " (" + p.n + ")",
          x: p.x, y: p.y, z: p.z, text: p.text,
          hovertemplate: "%{text}<extra></extra>",
          line: { color: p.color, width: p.width }, opacity: p.opacity,
        });
      }
      const g = pack.geom;
      data.push({ type: "scatter3d", mode: "lines", name: "concrete",
        x: g.concrete.x, y: g.concrete.y, z: g.concrete.z,
        line: { color: "#90A4AE", width: 3, dash: "dot" }, hoverinfo: "skip" });
      data.push({ type: "scatter3d", mode: "lines", name: "tunnel air",
        x: g.tunnel.x, y: g.tunnel.y, z: g.tunnel.z,
        line: { color: "#A5D6A7", width: 4 }, hoverinfo: "skip" });
      data.push({ type: "scatter3d", mode: "lines", name: "ground z=0",
        x: g.ground.x, y: g.ground.y, z: g.ground.z,
        line: { color: "#BCAAA4", width: 2 }, hoverinfo: "skip" });
      data.push({ type: "scatter3d", mode: "lines", name: "source plane",
        x: g.source.x, y: g.source.y, z: g.source.z,
        line: { color: "#CE93D8", width: 3 }, hoverinfo: "skip" });
      return data;
    }

    function layoutFor(pack) {
      const g = pack.stats.geometry_depth;
      return {
        title: "c10 = " + pack.c10 + " cm（天井 " + g.ceiling_depth_m + " m）",
        scene: {
          xaxis: { title: "x [cm]", range: [-650, 650] },
          yaxis: { title: "y [cm]", range: [-400, 400] },
          zaxis: { title: "z [cm] (上=地表)", range: pack.z_range },
          aspectmode: "manual",
          aspectratio: { x: 1.0, y: 0.65, z: 1.5 },
          camera: { eye: { x: 1.55, y: 1.35, z: 0.55 }, up: { x: 0, y: 0, z: 1 } },
        },
        legend: { title: { text: "click to toggle" } },
        margin: { l: 0, r: 0, t: 40, b: 0 },
        template: "plotly_white",
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        font: { color: "var(--fg)" },
      };
    }

    function renderCurrentStats(pack) {
      const s = pack.stats;
      const roi = s.tracks_in_view_roi;
      const disp = s.tracks_displayed;
      const raw = s.tracks_raw_by_particle;
      let html = "<dl>";
      html += "<dt>履歴数</dt><dd>" + s.histories + " <span style='color:var(--muted)'>（" + s.histories_note + "）</dd>";
      html += "<dt>4dtrack 全軌跡</dt><dd>" + s.tracks_raw_all.toLocaleString() + " 本</dd>";
      html += "<dt>表示中（描画）</dt><dd>" + Object.values(disp).reduce((a,b)=>a+b,0).toLocaleString() + " 本</dd>";
      html += "<dt>計算時間</dt><dd>" + (s.run.wall_sec != null ? s.run.wall_sec + " s" : "—") + "</dd>";
      html += "<dt>出力サイズ</dt><dd>" + (s.run.file_bytes != null ? (s.run.file_bytes/1e6).toFixed(1) + " MB" : "—") + "</dd>";
      html += "</dl>";
      html += "<table class='stats' style='margin-top:0.5rem'><thead><tr><th>粒子</th><th>raw</th><th>ROI</th><th>表示</th></tr></thead><tbody>";
      for (const name of ORDER) {
        html += "<tr><td>" + (LABELS[name]||name) + "</td><td>" + (raw[name]||0) + "</td><td>" + (roi[name]||0) + "</td><td>" + (disp[name]||0) + "</td></tr>";
      }
      html += "</tbody></table>";
      html += "<p class='note' style='margin:0.4rem 0 0;font-size:0.75rem'>raw=4dtrack全記録 / ROI=表示範囲内 / 表示=Plotly描画数（上限あり）</p>";
      document.getElementById("currentStats").innerHTML = html;
    }

    function renderSecondary(s) {
      const sec = s.secondary;
      const el = document.getElementById("secondaryStats");
      el.innerHTML = ""
        + "<dt>中性子 / μ 軌跡</dt><dd>" + fmt(sec.neutron_per_muon_track, 3) + "</dd>"
        + "<dt>陽子 / μ 軌跡</dt><dd>" + fmt(sec.proton_per_muon_track, 3) + "</dd>"
        + "<dt>中性子 / 履歴</dt><dd>" + fmt(sec.neutron_per_history, 3) + "</dd>"
        + "<dt>陽子 / 履歴</dt><dd>" + fmt(sec.proton_per_history, 3) + "</dd>"
        + "<dt>μ 軌跡（空洞内）</dt><dd>" + sec.muon_tracks_in_tunnel_air + "</dd>"
        + "<dt>中性子（空洞内）</dt><dd>" + sec.neutron_tracks_in_tunnel_air + "</dd>";
    }

    function renderEnergy(s) {
      const e = s.energy_mev;
      let html = "<table class='stats'><thead><tr><th>粒子</th><th>n</th><th>min</th><th>median</th><th>max</th><th>mean</th></tr></thead><tbody>";
      for (const name of ORDER) {
        const row = e[name];
        if (!row) continue;
        html += "<tr><td>" + (LABELS[name]||name) + "</td>"
          + "<td>" + row.n + "</td>"
          + "<td>" + fmt(row.min_mev) + "</td>"
          + "<td>" + fmt(row.median_mev) + "</td>"
          + "<td>" + fmt(row.max_mev) + "</td>"
          + "<td>" + fmt(row.mean_mev) + "</td></tr>";
      }
      html += "</tbody></table>";
      document.getElementById("energyTable").innerHTML = html;
    }

    function renderRegion(s) {
      const reg = s.by_region;
      const regions = ["tunnel_air", "concrete", "soil_or_outer", "above_surface"];
      const regLabel = { tunnel_air: "トンネル空洞", concrete: "コンクリート", soil_or_outer: "土/外側", above_surface: "地表面上" };
      let html = "<table class='stats'><thead><tr><th>領域</th>";
      for (const name of ORDER) html += "<th>" + (LABELS[name]||name) + "</th>";
      html += "</tr></thead><tbody>";
      for (const r of regions) {
        if (!reg[r]) continue;
        html += "<tr><td>" + (regLabel[r]||r) + "</td>";
        for (const name of ORDER) html += "<td>" + (reg[r][name]||0) + "</td>";
        html += "</tr>";
      }
      html += "</tbody></table>";
      document.getElementById("regionTable").innerHTML = html;
    }

    function renderGeom(g) {
      document.getElementById("geomStats").innerHTML = ""
        + "<dt>天井深さ</dt><dd>" + g.c10_cm + " cm（" + g.ceiling_depth_m + " m）</dd>"
        + "<dt>空洞上面 z</dt><dd>" + g.tunnel_top_z_cm + " cm</dd>"
        + "<dt>空洞下面 z</dt><dd>" + g.tunnel_bottom_z_cm + " cm</dd>"
        + "<dt>コンクリート上面</dt><dd>" + g.concrete_top_z_cm + " cm（地表）</dd>"
        + "<dt>コンクリート下面</dt><dd>" + g.concrete_bottom_z_cm + " cm</dd>"
        + "<dt>土下端 z</dt><dd>" + g.soil_bottom_z_cm + " cm</dd>";
    }

    function renderSimMeta() {
      const src = meta.source;
      const el = document.getElementById("simMeta");
      el.innerHTML = ""
        + "<dt>PHITS</dt><dd>" + meta.phits + "</dd>"
        + "<dt>履歴/深度</dt><dd>" + meta.histories_per_depth + "（maxcas=" + meta.maxcas + "×" + meta.maxbch + "）</dd>"
        + "<dt>線源</dt><dd>e-type=" + src.e_type + ", icenv=" + src.icenv + "</dd>"
        + "<dt>位置</dt><dd>" + src.location + ", 高度 " + src.altitude_km + " km</dd>"
        + "<dt>入射粒子</dt><dd>" + src.particles.join(", ") + "</dd>"
        + "<dt>線源半径</dt><dd>" + src.radius_cm + " cm（z=" + src.z_cm + " cm）</dd>"
        + "<dt>地中水分</dt><dd>environ=" + src.environ + "</dd>"
        + "<dt>材料</dt><dd>" + Object.entries(meta.materials).map(([k,v]) => k + ": " + v).join(" / ") + "</dd>";
    }

    function renderCompare(activeC10) {
      let html = "<table class='stats'><thead><tr><th>深度[m]</th><th>Hist</th><th>μ⁺</th><th>μ⁻</th><th>n</th><th>p</th><th>n/μ</th><th>空洞n</th></tr></thead><tbody>";
      for (const row of summaryTable) {
        const cls = row.c10_cm === activeC10 ? " class='active'" : "";
        html += "<tr" + cls + "><td>" + depthLabel(row.c10_cm) + "</td><td>" + row.histories + "</td>"
          + "<td>" + row["muon+"] + "</td><td>" + row["muon-"] + "</td>"
          + "<td>" + row.neutron + "</td><td>" + row.proton + "</td>"
          + "<td>" + fmt(row.n_per_muon, 3) + "</td><td>" + row.n_in_tunnel + "</td></tr>";
      }
      html += "</tbody></table>";
      document.getElementById("compareTable").innerHTML = html;
    }

    function depthLabel(c10) {
      const m = c10 / 100;
      if (m >= 100) return m.toFixed(0) + " m";
      if (m >= 10) return m.toFixed(1) + " m";
      return m.toFixed(2) + " m";
    }

    function render() {
      const c10 = depths[Number(slider.value)];
      const pack = byDepth[String(c10)];
      depthVal.textContent = c10.toLocaleString();
      depthM.textContent = depthLabel(c10);
      renderCurrentStats(pack);
      renderSecondary(pack.stats);
      renderEnergy(pack.stats);
      renderRegion(pack.stats);
      renderGeom(pack.stats.geometry_depth);
      renderCompare(c10);
      Plotly.react("plot", buildData(pack), layoutFor(pack), { responsive: true });
    }

    async function init() {
      const statusEl = document.getElementById("status");
      statusEl.hidden = false;
      statusEl.textContent = "軌跡データを読み込み中…";
      const res = await fetch("tracks_by_depth.json");
      if (!res.ok) throw new Error("tracks_by_depth.json: " + res.status);
      const payload = await res.json();
      meta = payload.meta || {};
      depths = payload.depths;
      byDepth = payload.by_depth;
      summaryTable = payload.summary_table || [];
      document.getElementById("metaLine").textContent =
        meta.phits + " · " + meta.histories_per_depth + " histories/深度 · " + (meta.source && meta.source.location);
      renderSimMeta();
      slider.min = 0;
      slider.max = depths.length - 1;
      slider.value = depths.length - 1;
      slider.disabled = false;
      statusEl.hidden = true;
      slider.addEventListener("input", render);
      render();
    }

    init().catch((err) => {
      const statusEl = document.getElementById("status");
      statusEl.hidden = false;
      statusEl.textContent = "読み込み失敗: " + err.message;
    });
  </script>
  <script src="../../../theme.js"></script>
</body>
</html>
