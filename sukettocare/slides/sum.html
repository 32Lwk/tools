<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@700&display=swap" rel="stylesheet"><link href="fonts/ms.css" rel="stylesheet"><link rel="stylesheet" href="common.css">
<title>まとめ</title>
<style>
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:44px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:"liga";vertical-align:middle}
body{background:#F7F5EE}
.eb{position:absolute;left:90px;top:30px;font-size:28px;font-weight:700;color:#fff;border-radius:999px;padding:4px 22px;font-family:"Noto Sans JP",Inter;background:#188038}
.tt{position:absolute;left:90px;top:88px;font-size:88px;font-weight:900;line-height:1.1;white-space:nowrap;color:#202124}
/* 上: できること（流れ） */
.band{position:absolute;left:90px;top:236px;width:1740px;height:118px;background:#E8F0FE;border:3px solid #1A73E8;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:22px;font-size:46px;font-weight:900;color:#1A73E8}
.band .ms{font-size:52px;color:#5F6368}
.band .all{color:#202124;margin-left:6px}
/* 下: すごいところ（イラストの札） */
.row{position:absolute;left:90px;top:396px;width:1740px;display:flex;gap:50px}
.cd{flex:1;background:#fff;border:3px solid;border-radius:32px;padding:26px 30px;height:600px;position:relative}
.n{font-family:Inter;font-weight:700;font-size:30px;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.il{display:flex;justify-content:center;margin:-6px 0 8px}
.il img{width:390px;height:260px;border-radius:20px;object-fit:cover}
.cd h3{font-size:56px;font-weight:900;margin-bottom:12px;line-height:1.15}
.who{display:inline-block;font-size:28px;font-weight:700;color:#fff;background:#5F6368;border-radius:999px;padding:2px 18px;margin-bottom:8px}
.cd p{font-size:38px;line-height:1.4;color:#202124;font-weight:700}
</style></head>
<body>
<div class="eb">まとめ</div>
<div class="tt">助っ人ケアで、できること</div>

<div class="band rv" data-cue="0">欠員の連絡<span class="ms">arrow_forward</span>代わりの確保<span class="ms">arrow_forward</span>シフトの組み直し<span class="all">を、まるごと自動で</span></div>

<div class="row">
  <div class="cd rv" data-cue="1" style="border-color:#E37400"><div class="n" style="background:#E37400">1</div>
    <div class="il"><img src="s1.jpg" alt=""></div><h3>ルールを破らない</h3><div class="who">最適化ソルバー</div><p>検証でも違反 0 件</p></div>
  <div class="cd rv" data-cue="1" style="border-color:#188038;transition-delay:.15s"><div class="n" style="background:#188038">2</div>
    <div class="il"><img src="s2.jpg" alt=""></div><h3>施設ごとに育つ</h3><div class="who">学習</div><p>使うほど、打診が上手に</p></div>
  <div class="cd rv" data-cue="1" style="border-color:#1A73E8;transition-delay:.3s"><div class="n" style="background:#1A73E8">3</div>
    <div class="il"><img src="s3.jpg" alt=""></div><h3>承認するだけ</h3><div class="who">リーダー</div><p>夜中の電話は、いらない</p></div>
</div>

<img src="badge.png" alt="" style="position:absolute;left:1500px;top:0;width:400px;height:215px;z-index:50">
<script>window.STEPS = [[[0, 0]], [[1, 0]]];</script>
<script src="stepper.js"></script>
</body></html>
