<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>印刷用の原稿</title>
<style>
  :root { --ink:#202124; --sub:#5f6368; --line:#dadce0; --bg:#fff; --blue:#1a73e8; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Hiragino Sans','Noto Sans JP',system-ui,sans-serif; padding:24px 16px; }
  main { max-width:820px; margin:0 auto; }
  h1 { font-size:20px; } .lead { color:var(--sub); font-size:12px; margin:4px 0 14px; }
  nav { font-size:13px; margin-bottom:10px; } nav a { color:var(--blue); }
  .s { display:grid; grid-template-columns:120px 1fr; gap:12px; padding:9px 0; border-top:1px solid var(--line); break-inside:avoid; }
  .s img { width:120px; aspect-ratio:16/9; object-fit:cover; border-radius:4px; border:1px solid var(--line); }
  .meta { font-size:11px; color:var(--sub); margin-bottom:2px; font-variant-numeric:tabular-nums; }
  .meta b { color:var(--ink); font-size:12px; }
  .s p { font-size:15px; line-height:1.6; }
  @page { size:A4; margin:12mm; }
  @media print { nav { display:none; } body { padding:0; } }
  @media (max-width:520px) { .s { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
<nav><a href="index.html">スライド</a>　<a href="qa.html">想定問答</a>　<a href="javascript:print()">印刷する</a></nav>
<h1>助っ人ケア 発表原稿（3分45秒・約1,200字）</h1>
<p class="lead">右の「ここまで」は、そのページを終える目安の経過時間。制限は 4:00。</p>
<div id="list"></div>
</main>
<script src="data.js"></script>
<script>
const fmt = (s) => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
document.getElementById('list').innerHTML = window.DECK.map((s, i) => `
  <div class="s"><img src="media/${s.id}.jpg" alt="">
  <div><div class="meta"><b>${i + 1}. ${s.title}</b>　目安 ${Math.round(s.target)} 秒　ここまで ${fmt(s.cumEnd)}</div>
  ${s.lines.map((l) => `<p>${l}</p>`).join('')}</div></div>`).join('');
</script>
</body>
</html>
