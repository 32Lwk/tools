<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JANバーコード生成 – tools.yutok.dev</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg:      #f0f2f5;
      --surface: #ffffff;
      --border:  #e2e4e9;
      --accent:  #2563eb;
      --accent2: #1d4ed8;
      --ok:      #16a34a;
      --warn:    #d97706;
      --muted:   #6b7280;
      --radius:  10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: #1a1a2e;
      margin: 0;
      padding: 1.2rem 1rem 3rem;
    }

    /* ─── ヘッダー ─── */
    .page-header {
      max-width: 820px;
      margin: 0 auto 1.4rem;
    }
    .page-header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0 0 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .page-header h1 svg { flex-shrink: 0; }
    .page-header p { margin: 0; color: var(--muted); font-size: 0.85rem; }

    /* ─── カード ─── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.3rem;
      margin: 0 auto 1rem;
      max-width: 820px;
    }
    .card-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin: 0 0 0.9rem;
    }

    /* ─── 入力エリア ─── */
    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 0.7rem;
      align-items: end;
    }
    @media (max-width: 560px) {
      .input-row { grid-template-columns: 1fr; }
    }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #374151;
    }
    .field input {
      border: 1.5px solid var(--border);
      border-radius: 7px;
      padding: 0.55rem 0.75rem;
      font-size: 1rem;
      font-family: inherit;
      background: #fafafa;
      transition: border-color .15s, box-shadow .15s;
      width: 100%;
    }
    .field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
      background: #fff;
    }
    .field input.has-warn { border-color: var(--warn); }

    /* ─── バーコードプレビューエリア ─── */
    #preview-area {
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      background: #f8faff;
      border: 1px dashed #c7d3f0;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      min-height: 90px;
    }
    #preview-svg { display: none; flex-shrink: 0; }
    #preview-text { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
    #preview-text .ok   { color: var(--ok);   font-weight: 700; }
    #preview-text .warn { color: var(--warn);  font-weight: 700; }
    #preview-text .err  { color: #dc2626;      font-weight: 700; }
    .digit-count { font-size: 0.75rem; color: var(--muted); margin-top: 3px; }

    /* ─── ボタン ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      border: none;
      border-radius: 7px;
      padding: 0.55rem 1.1rem;
      font-size: 0.87rem;
      font-weight: 600;
      font-family: inherit;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:hover:not(:disabled)  { opacity: 0.88; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary   { background: var(--accent); color: #fff; }
    .btn-ghost     { background: transparent; border: 1.5px solid var(--border); color: #374151; }
    .btn-green     { background: var(--ok); color: #fff; }
    .btn-red-ghost { background: transparent; border: 1.5px solid #fca5a5; color: #dc2626;
                     padding: 0.25rem 0.6rem; font-size: 0.75rem; border-radius: 5px; }
    .btn-red-ghost:hover:not(:disabled) { background: #fef2f2; }

    /* ─── プリセット ─── */
    .preset-tabs {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .tab-btn {
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--muted);
      transition: all .15s;
      font-family: inherit;
    }
    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 0.4rem;
    }
    .preset-item {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 0.45rem 0.65rem;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      background: #fafafa;
      cursor: pointer;
      transition: border-color .12s, background .12s;
      font-family: inherit;
      text-align: left;
    }
    .preset-item:hover { border-color: var(--accent); background: #eff6ff; }
    .preset-item .pi-name { font-size: 0.82rem; font-weight: 600; color: #1f2937; }
    .preset-item .pi-code { font-size: 0.73rem; font-family: monospace; color: var(--muted); }

    /* ─── 登録リスト ─── */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }
    .list-header .card-title { margin: 0; }
    .count-pill {
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.1rem 0.55rem;
    }
    #item-list { list-style: none; padding: 0; margin: 0 0 0.9rem; }
    #item-list li {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 0.85rem;
    }
    #item-list li:last-child { border-bottom: none; }
    .li-idx  { color: var(--muted); font-size: 0.72rem; min-width: 1.4rem; text-align: right; }
    .li-name { flex: 1; font-weight: 500; }
    .li-code { font-family: monospace; color: var(--muted); font-size: 0.82rem; }
    .li-warn { font-size: 0.68rem; color: var(--warn); font-weight: 600;
               background: #fffbeb; border-radius: 3px; padding: 0 4px; }
    .empty-note { color: var(--muted); font-size: 0.85rem; padding: 0.4rem 0; }

    .action-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* ─── シートプレビュー ─── */
    #sheet-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      margin-top: 0.6rem;
    }
    .bc-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 0.5rem 0.7rem 0.4rem;
    }
    .bc-cell svg { max-width: 145px; }
    .bc-label {
      margin-top: 0.25rem;
      font-size: 0.72rem;
      color: #374151;
      text-align: center;
      max-width: 145px;
      word-break: break-all;
      line-height: 1.3;
    }
    .bc-warn-label {
      font-size: 0.65rem;
      color: var(--warn);
      font-weight: 600;
    }

    /* ─── フッター ─── */
    footer {
      max-width: 820px;
      margin: 1.5rem auto 0;
      font-size: 0.78rem;
      color: #9ca3af;
    }
    footer a { color: #9ca3af; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>

<!-- ─── JsBarcode ─── -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"
        onerror="loadFallback()"></script>
<script>
function loadFallback() {
  const s = document.createElement('script');
  s.src = 'https://unpkg.com/jsbarcode@3.11.6/dist/JsBarcode.all.min.js';
  s.onload = () => { if (typeof initApp === 'function') initApp(); };
  s.onerror = () => { document.getElementById('preview-text').innerHTML = '<span class="err">ライブラリの読み込みに失敗しました。再読み込みしてください。</span>'; };
  document.head.appendChild(s);
}
</script>

<script>
/* ━━━━━━━━━━━━━━━━━━━━━━━━
   プリセットデータ
━━━━━━━━━━━━━━━━━━━━━━━━ */
const PRESETS = {
  'ホット': [
    {n:'アメリカーノ S',     c:'6013000000480'},{n:'アメリカーノ M',     c:'6013000000471'},
    {n:'ホットラテ S',       c:'6010400002658'},{n:'ホットラテ M',       c:'6013000000476'},
    {n:'カプチーノ S',       c:'6013000000481'},{n:'カプチーノ M',       c:'6013000000474'},
    {n:'[栄]あんバターラテ', c:'6013500003408'},{n:'[栄]フレンチプレス', c:'6013500003422'},
    {n:'[栄]抹茶ラテ',       c:'6013500003407'},{n:'ほうじ茶ラテ',       c:'6013000000521'},
  ],
  'アイス': [
    {n:'アイスアメリカーノ S',c:'6010400002664'},{n:'アイスアメリカーノ M',c:'6013000000479'},
    {n:'アイスラテ S',        c:'6013000000477'},{n:'アイスラテ M',        c:'6013000000478'},
    {n:'[栄]あんバターラテ',  c:'6013500003408'},{n:'信州産リンゴジュース',c:'6088888000953'},
    {n:'ソフトモカ フルサイズ',c:'6013000000625'},
  ],
  '包装': [
    {n:'不織布M',       c:'4589694514001'},{n:'不織布L',       c:'4589694513998'},
    {n:'ギフト包装',    c:'2499000000017'},{n:'簡易包装',      c:'2499000000024'},
    {n:'10個スリーブ',  c:'2071284041650'},{n:'20個スリーブ',  c:'2071284041643'},
    {n:'新紙袋（小）',  c:'4589694501087'},{n:'新紙袋（中）',  c:'4589694501070'},
    {n:'軽井沢Dセット', c:'6010400003488'},{n:'軽井沢アイスセット',c:'6010400003479'},
  ],
  'デザート': [
    {n:'コーヒーソフトクリーム',  c:'4589694513073'},
    {n:'SOゼリー ケニア',         c:'4589694509373'},{n:'SOゼリー エチオピア',c:'4589694509366'},
    {n:'SOゼリー ブラジル',       c:'4589694509380'},{n:'SOゼリー 6個入り',   c:'4589694509328'},
    {n:'ゼリー＆プリンセット',    c:'4589694509335'},
  ],
};

/* ━━━━━━━━━━━━━━━━━━━━━━━━
   状態
━━━━━━━━━━━━━━━━━━━━━━━━ */
let items = [];
let activeTab = Object.keys(PRESETS)[0];

/* ━━━━━━━━━━━━━━━━━━━━━━━━
   EAN-13 チェックデジット検証
━━━━━━━━━━━━━━━━━━━━━━━━ */
function validateEAN13(code) {
  if (!/^\d{13}$/.test(code)) return false;
  let s = 0;
  for (let i = 0; i < 12; i++) s += +code[i] * (i % 2 === 0 ? 1 : 3);
  return (10 - s % 10) % 10 === +code[12];
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━
   SVG生成ヘルパー
━━━━━━━━━━━━━━━━━━━━━━━━ */
function makeSVG(code, opts) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  try {
    JsBarcode(svg, code, { format: 'EAN13', ...opts });
    if (svg.childElementCount === 0) throw new Error('empty');
  } catch (_) {
    // EAN13失敗 → CODE128でフォールバック
    svg.innerHTML = '';
    JsBarcode(svg, code, { format: 'CODE128', ...opts });
  }
  return svg;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━
   プリセット描画
━━━━━━━━━━━━━━━━━━━━━━━━ */
function renderPresets() {
  // タブ
  const tabsEl = document.getElementById('preset-tabs');
  tabsEl.innerHTML = '';
  Object.keys(PRESETS).forEach(sec => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (sec === activeTab ? ' active' : '');
    btn.textContent = sec;
    btn.onclick = () => { activeTab = sec; renderPresets(); };
    tabsEl.appendChild(btn);
  });

  // グリッド
  const grid = document.getElementById('preset-grid');
  grid.innerHTML = '';
  (PRESETS[activeTab] || []).forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'preset-item';
    btn.innerHTML = `<span class="pi-name">${h(r.n)}</span><span class="pi-code">${r.c}</span>`;
    btn.onclick = () => {
      document.getElementById('jan-input').value = r.c;
      document.getElementById('name-input').value = r.n;
      onInput();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    grid.appendChild(btn);
  });
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━
   入力ハンドラ
━━━━━━━━━━━━━━━━━━━━━━━━ */
/* preview-msg だけを更新するヘルパー（digit-count を壊さない） */
function setMsg(html) {
  document.getElementById('preview-msg').innerHTML = html;
}

function onInput() {
  const code    = document.getElementById('jan-input').value.trim();
  const svgEl   = document.getElementById('preview-svg');
  const countEl = document.getElementById('digit-count');
  const addBtn  = document.getElementById('add-btn');
  const inp     = document.getElementById('jan-input');

  svgEl.style.display = 'none';
  svgEl.innerHTML = '';
  inp.classList.remove('has-warn');
  addBtn.disabled = true;

  if (!code) {
    setMsg('JANコードを入力するとここにプレビューが表示されます');
    countEl.textContent = '';
    return;
  }

  if (!/^\d+$/.test(code)) {
    setMsg('<span class="err">数字のみ入力してください</span>');
    countEl.textContent = '';
    return;
  }

  countEl.textContent = `${code.length} / 13桁`;

  if (code.length !== 13) {
    setMsg('あと <strong>' + (13 - code.length) + '</strong> 桁入力してください');
    return;
  }

  // 13桁揃った → 描画（チェックデジット不問）
  const valid = validateEAN13(code);
  svgEl.innerHTML = '';
  let drawOk = false;

  // まず EAN13 で試みる
  try {
    JsBarcode(svgEl, code, {
      format: 'EAN13', width: 2, height: 64,
      displayValue: true, fontSize: 13, margin: 8,
    });
    drawOk = svgEl.childElementCount > 0;
  } catch (e) { drawOk = false; }

  // EAN13失敗 → CODE128 でフォールバック
  if (!drawOk) {
    try {
      svgEl.innerHTML = '';
      JsBarcode(svgEl, code, {
        format: 'CODE128', width: 2, height: 64,
        displayValue: true, fontSize: 13, margin: 8,
      });
      drawOk = svgEl.childElementCount > 0;
    } catch (e2) { drawOk = false; }
  }

  if (drawOk) {
    svgEl.style.display = 'block';
    if (valid) {
      setMsg('<span class="ok">✓ 有効なEAN-13コードです</span>');
    } else {
      inp.classList.add('has-warn');
      setMsg('<span class="warn">⚠ チェックデジットが不一致ですが生成できます</span>' +
        '<br><small style="color:var(--muted)">正規のコードでない可能性があります。このまま追加することもできます。</small>');
    }
    addBtn.disabled = false;
  } else {
    setMsg('<span class="err">バーコードを生成できませんでした。コードを確認してください。</span>');
  }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━
   追加 / 削除 / クリア
━━━━━━━━━━━━━━━━━━━━━━━━ */
function addItem() {
  const code  = document.getElementById('jan-input').value.trim();
  const name  = document.getElementById('name-input').value.trim() || code;
  if (!/^\d{13}$/.test(code)) return;
  const warn = !validateEAN13(code);
  items.push({ name, code, warn });

  document.getElementById('jan-input').value = '';
  document.getElementById('name-input').value = '';
  document.getElementById('jan-input').classList.remove('has-warn');
  document.getElementById('preview-svg').style.display = 'none';
  document.getElementById('preview-svg').innerHTML = '';
  setMsg('JANコードを入力するとここにプレビューが表示されます');
  document.getElementById('digit-count').textContent = '';
  document.getElementById('add-btn').disabled = true;

  renderList();
  renderSheet();
}

function removeItem(i) { items.splice(i, 1); renderList(); renderSheet(); }

function clearAll() {
  if (items.length && !confirm('登録済みの商品をすべて削除しますか？')) return;
  items = []; renderList(); renderSheet();
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━
   リスト描画
━━━━━━━━━━━━━━━━━━━━━━━━ */
function renderList() {
  const ul    = document.getElementById('item-list');
  const empty = items.length === 0;
  document.getElementById('count').textContent = items.length;
  document.getElementById('pdf-btn').disabled  = empty;
  document.getElementById('svg-btn').disabled  = empty;

  if (empty) {
    ul.innerHTML = '<li><span class="empty-note">まだ商品が登録されていません。上から追加してください。</span></li>';
    return;
  }
  ul.innerHTML = '';
  items.forEach((it, i) => {
    const li = document.createElement('li');
    li.innerHTML =
      `<span class="li-idx">${i + 1}</span>` +
      `<span class="li-name">${h(it.name)}</span>` +
      `<span class="li-code">${h(it.code)}</span>` +
      (it.warn ? '<span class="li-warn">要確認</span>' : '');
    const del = document.createElement('button');
    del.className = 'btn btn-red-ghost';
    del.textContent = '削除';
    del.onclick = () => removeItem(i);
    li.appendChild(del);
    ul.appendChild(li);
  });
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━
   シートプレビュー
━━━━━━━━━━━━━━━━━━━━━━━━ */
function renderSheet() {
  const card = document.getElementById('sheet-card');
  const wrap = document.getElementById('sheet-wrap');
  if (items.length === 0) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  wrap.innerHTML = '';
  items.forEach(it => {
    const cell = document.createElement('div');
    cell.className = 'bc-cell';
    try {
      const svg = makeSVG(it.code, { width: 1.5, height: 50, displayValue: true, fontSize: 11, margin: 6 });
      cell.appendChild(svg);
    } catch (e) {}
    const lbl = document.createElement('div');
    lbl.className = 'bc-label';
    lbl.textContent = it.name;
    cell.appendChild(lbl);
    if (it.warn) {
      const w = document.createElement('div');
      w.className = 'bc-warn-label';
      w.textContent = '⚠ 要確認';
      cell.appendChild(w);
    }
    wrap.appendChild(cell);
  });
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━
   PDF 出力
━━━━━━━━━━━━━━━━━━━━━━━━ */
async function generatePDF() {
  if (!items.length) return;

  const pdfBtn = document.getElementById('pdf-btn');
  pdfBtn.disabled = true;
  pdfBtn.textContent = '生成中…';

  try {
    if (typeof window.jspdf === 'undefined') {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
        .catch(() => loadScript('https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'));
    }

    const { jsPDF } = window.jspdf;
    const COLS = 3, CW = 62, CH = 38, MX = 10, MY = 10, PW = 210, PH = 297;
    const TOP = MY + 14;
    const rowsPerPage = Math.floor((PH - MY - TOP) / CH);

    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    doc.setFontSize(13);
    doc.text('JANバーコードまとめシート', MX, MY + 5);
    doc.setFontSize(8);
    doc.setTextColor(140);
    doc.text(
      new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' }),
      PW - MX, MY + 5, { align: 'right' }
    );
    doc.setTextColor(0);

    const svgToCanvas = svgEl => new Promise(res => {
      const xml  = new XMLSerializer().serializeToString(svgEl);
      const blob = new Blob([xml], { type: 'image/svg+xml' });
      const url  = URL.createObjectURL(blob);
      const img  = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width  = img.naturalWidth  || 300;
        c.height = img.naturalHeight || 150;
        c.getContext('2d').drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        res(c);
      };
      img.src = url;
    });

    let currentPage = 0;
    for (let i = 0; i < items.length; i++) {
      const col     = i % COLS;
      const row     = Math.floor(i / COLS);
      const pageRow = row % rowsPerPage;

      if (row > 0 && pageRow === 0 && col === 0) {
        doc.addPage();
        currentPage++;
        doc.setFontSize(13);
        doc.text('JANバーコードまとめシート', MX, MY + 5);
        doc.setFontSize(8); doc.setTextColor(140);
        doc.text(
          new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' }),
          PW - MX, MY + 5, { align: 'right' }
        );
        doc.setTextColor(0);
      }

      const svg = makeSVG(items[i].code, { width: 2, height: 80, displayValue: true, fontSize: 13, margin: 10 });
      document.body.appendChild(svg);
      const canvas = await svgToCanvas(svg);
      document.body.removeChild(svg);

      const imgW = CW - 4;
      const imgH = imgW * (canvas.height / canvas.width);
      const cx   = MX + col * (CW + 3);
      const cy   = TOP + pageRow * CH;

      doc.addImage(canvas.toDataURL('image/png'), 'PNG', cx, cy, imgW, imgH);
      doc.setFontSize(7.5);
      doc.text(items[i].name, cx + imgW / 2, cy + imgH + 3.5, { align: 'center', maxWidth: imgW });
      if (items[i].warn) {
        doc.setFontSize(6.5);
        doc.setTextColor(180, 100, 0);
        doc.text('⚠ 要確認', cx + imgW / 2, cy + imgH + 7, { align: 'center' });
        doc.setTextColor(0);
      }
    }

    doc.save('jan_sheet.pdf');
  } finally {
    pdfBtn.disabled = false;
    pdfBtn.innerHTML =
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg> まとめシートPDF出力';
    document.getElementById('pdf-btn').disabled = items.length === 0;
  }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━
   SVG 個別ダウンロード
━━━━━━━━━━━━━━━━━━━━━━━━ */
function generateSVGs() {
  items.forEach(it => {
    const svg = makeSVG(it.code, { width: 3, height: 100, displayValue: true, fontSize: 16, margin: 12 });
    document.body.appendChild(svg);
    const xml = new XMLSerializer().serializeToString(svg);
    document.body.removeChild(svg);
    const a = document.createElement('a');
    a.href     = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
    a.download = `${it.name}_${it.code}.svg`;
    a.click();
  });
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━
   ユーティリティ
━━━━━━━━━━━━━━━━━━━━━━━━ */
function h(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━
   起動
━━━━━━━━━━━━━━━━━━━━━━━━ */
function initApp() {
  document.getElementById('jan-input').addEventListener('input', onInput);
  document.getElementById('jan-input').addEventListener('keydown',  e => { if (e.key === 'Enter') addItem(); });
  document.getElementById('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
  renderPresets();
  renderList();
}

if (typeof JsBarcode !== 'undefined') initApp();
</script>
